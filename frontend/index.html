<!DOCTYPE html>
<html lang="en" data-inboxora-surface="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Inboxora</title>
  <meta name="description" content="Inboxora — your private inbox for email, contacts and calendars"/>
  <meta name="theme-color" content="#35558a"/>

  <!-- PWA manifest -->
  <link rel="manifest" href="/manifest.json?v=inboxora-3"/>

  <!-- iOS home-screen PWA -->
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Inboxora"/>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/inboxora-envelope-512.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/inboxora-envelope-180.png"/>

  <!--
    Self-hosted fonts — no external font requests. Generated into public/fonts/ by
    scripts/selfhost-fonts, covering every family/weight/subset the app font sets and
    chrome use. fonts.js only swaps CSS variables at runtime.
  -->
  <link rel="stylesheet" href="/fonts/fonts.css">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
