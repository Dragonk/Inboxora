<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inboxora Setup</title>
    <style>
      :root {
        color-scheme: dark light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #101113;
        color: #f4f5f7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top left, rgba(124, 106, 247, 0.28), transparent 36rem),
          #101113;
      }

      main {
        width: min(100%, 440px);
      }

      body.setup-pending main {
        visibility: hidden;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 28px;
        font-weight: 750;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 24px;
        color: #b7bdc8;
        line-height: 1.5;
      }

      form {
        display: grid;
        gap: 14px;
      }

      label {
        display: grid;
        gap: 8px;
        color: #d9dce3;
        font-size: 14px;
        font-weight: 650;
      }

      input {
        width: 100%;
        min-height: 48px;
        border: 1px solid #3a3f4a;
        border-radius: 8px;
        padding: 0 14px;
        background: #17191d;
        color: #f4f5f7;
        font: inherit;
      }

      input:focus {
        border-color: #8f82ff;
        outline: 3px solid rgba(143, 130, 255, 0.24);
      }

      button {
        min-height: 48px;
        border: 0;
        border-radius: 8px;
        background: #7c6af7;
        color: white;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .error {
        min-height: 20px;
        color: #ff9b9b;
        font-size: 14px;
      }
    </style>
  </head>
  <body class="setup-pending">
    <main>
      <h1>Connect Inboxora</h1>
      <p>Enter the host for your Inboxora server.</p>

      <form id="setup-form">
        <label>
          Inboxora host
          <input
            id="host-input"
            name="host"
            inputmode="url"
            autocomplete="url"
            placeholder="https://mail.your-domain.com"
            required
          />
        </label>
        <button id="submit-button" type="submit">Continue</button>
        <div id="error" class="error" role="alert"></div>
      </form>
    </main>

    <script>
      const STORAGE_KEY = 'inboxora.host';
      const form = document.querySelector('#setup-form');
      const input = document.querySelector('#host-input');
      const button = document.querySelector('#submit-button');
      const error = document.querySelector('#error');

      // Capacitor exposes natively registered plugins under Capacitor.Plugins,
      // and also offers the low-level Capacitor.nativePromise(...) entry point.
      // Prefer the former, fall back to the latter: the setup screen must never
      // depend on one specific bridge shape.
      function callNative(method, args, fallback) {
        const plugin = window.Capacitor?.Plugins?.InboxoraNative;
        if (plugin && typeof plugin[method] === 'function') {
          return Promise.resolve(plugin[method](args || {}));
        }
        const cap = window.Capacitor;
        if (cap && typeof cap.nativePromise === 'function') {
          return cap.nativePromise('InboxoraNative', method, args || {});
        }
        return Promise.resolve(fallback);
      }

      function installCapacitorNativeBridge() {
        // Electron injects window.inboxoraNative via its preload script; keep it.
        if (window.inboxoraNative && typeof window.inboxoraNative.saveHost === 'function') return;

        const hasPlugin = !!window.Capacitor?.Plugins?.InboxoraNative;
        const hasRawBridge = typeof window.Capacitor?.nativePromise === 'function';
        if (!hasPlugin && !hasRawBridge) return;

        window.inboxoraNative = {
          ...(window.inboxoraNative || {}),
          getHost: async () => {
            const result = await callNative('getHost', undefined, {});
            return result?.host || null;
          },
          saveHost: async (host) => {
            const result = await callNative('saveHost', { host }, null);
            if (!result || !result.host) throw new Error('The native host could not be saved.');
            return result.host;
          },
          checkNotificationPermission: async () => {
            const result = await callNative('checkNotificationPermission', undefined, {});
            return result?.permission || 'default';
          },
          requestNotificationPermission: async () => {
            const result = await callNative('requestNotificationPermission', undefined, {});
            return result?.permission || 'default';
          },
          resetHost: async () => callNative('resetHost', undefined, null),
        };
      }

      // Never leave "Continue" looking dead: if the native side does not answer,
      // re-enable the button with a message instead of hanging forever.
      function withTimeout(promise, ms, message) {
        return Promise.race([
          promise,
          new Promise((_, reject) => setTimeout(() => reject(new Error(message)), ms)),
        ]);
      }

      function normalizeHost(value) {
        const url = new URL(String(value || '').trim());

        if (!['https:', 'http:'].includes(url.protocol)) {
          throw new Error('Host must start with https:// or http://');
        }

        url.username = '';
        url.password = '';
        url.hash = '';
        url.search = '';
        url.pathname = '/';

        return url.toString().replace(/\/$/, '');
      }

      function loadHost(host) {
        window.location.replace(host);
      }

      function showSetup() {
        document.body.classList.remove('setup-pending');
      }

      async function requestInitialNotificationPermission() {
        if (!window.inboxoraNative) return;

        const permission = await window.inboxoraNative.checkNotificationPermission();
        if (permission === 'default') {
          await window.inboxoraNative.requestNotificationPermission();
        }
      }

      async function restoreHost() {
        installCapacitorNativeBridge();

        if (window.inboxoraNative) {
          requestInitialNotificationPermission().catch(() => {});
          const host = await window.inboxoraNative.getHost();
          if (host) loadHost(host);
          else showSetup();
          return;
        }

        const host = localStorage.getItem(STORAGE_KEY);
        if (host) loadHost(host);
        else showSetup();
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        error.textContent = '';
        button.disabled = true;

        try {
          const host = normalizeHost(input.value);

          if (window.inboxoraNative && typeof window.inboxoraNative.saveHost === 'function') {
            const savedHost = await withTimeout(
              window.inboxoraNative.saveHost(host),
              20000,
              'The app did not answer. Please try again.',
            );
            loadHost(savedHost || host);
          } else {
            localStorage.setItem(STORAGE_KEY, host);
            loadHost(host);
          }
        } catch (err) {
          error.textContent = err.message || 'Enter a valid Inboxora host.';
          button.disabled = false;
        }
      });

      restoreHost().catch(() => showSetup());
    </script>
  </body>
</html>
