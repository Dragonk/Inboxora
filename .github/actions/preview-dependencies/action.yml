name: Attachment processing dependencies
description: Install pinned PDF validation and native archive dependencies.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: backend/preview/requirements.txt
    - shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends libarchive13t64 libseccomp2
        python -m pip install --only-binary=:all: --require-hashes -r backend/preview/requirements.txt
