name: Documentation screenshots

# Keeps media/screenshots/ an accurate picture of the application.
#
# The screenshot spec drives the real application with one shared, populated English demo
# dataset and asserts a presentation contract before every capture: the same theme, the
# unified inbox present, and a populated list, an opened message or declared module
# content. A capture that would be empty, unstyled or inconsistent fails the run.
#
#  - pull_request / push: regenerate and fail if the committed images are stale, so a
#    screenshot can never silently describe an interface that no longer exists;
#  - workflow_dispatch: regenerate and commit the result back to the branch.
#
# Run locally with:
#   cd frontend && DOCS_SCREENSHOTS=1 npx playwright test e2e/docs-screenshots.spec.js \
#     --project=chromium-desktop --project=chromium-mobile-390

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit the regenerated screenshots back to the branch"
        required: false
        type: boolean
        default: true
      branch:
        description: "Branch to update (defaults to the branch this workflow was dispatched from)"
        required: false
        type: string
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: docs-screenshots-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  changes:
    uses: ./.github/workflows/ci-plan.yml
  screenshots:
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    name: Regenerate and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # `github.ref_name` is "1/merge" on a pull_request — not a branch — so it can
          # never be fetched. `github.ref` is always a real ref ("refs/pull/N/merge",
          # "refs/heads/dev"); a dispatch may override the branch explicitly.
          ref: ${{ inputs.branch || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: npx playwright install --with-deps chromium

      # The spec runs `vite preview`, which serves frontend/dist. Building first is
      # required, otherwise the captures would show the previous bundle.
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Keep the committed images so the regenerated ones can be compared against them.
      - name: Snapshot the committed screenshots
        run: |
          mkdir -p artifacts/docs-baseline
          cp media/screenshots/*.png artifacts/docs-baseline/

      - name: Generate documentation screenshots
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: npm run docs:screenshots

      - name: Verify the screenshot set
        run: node scripts/verify-docs-screenshots.mjs

      # Pixel comparison with the same tolerance the visual regression spec uses, because
      # byte equality is not achievable across machines even for an identical interface.
      - name: Compare with the committed screenshots
        id: comparison
        continue-on-error: true
        run: |
          node scripts/compare-docs-screenshots.mjs \
            artifacts/docs-baseline media/screenshots \
            --diff-dir artifacts/docs-screenshot-diffs

      - name: Report staleness
        id: staleness
        run: |
          if [[ "${{ steps.comparison.outcome }}" == "success" ]]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the generated screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-screenshots-${{ github.run_id }}
          if-no-files-found: error
          path: |
            media/screenshots/
            artifacts/docs-screenshot-diffs/

      # Verification runs: the committed images must match what the application renders now.
      - name: Fail when the committed screenshots are stale
        if: steps.staleness.outputs.stale == 'true' && github.event_name != 'workflow_dispatch'
        run: |
          echo "::error::media/screenshots/ is out of date. Download the docs-screenshots artifact (it includes diff images) and commit the regenerated set, or dispatch this workflow with 'commit' enabled."
          exit 1

      - name: Commit the regenerated screenshots
        if: steps.staleness.outputs.stale == 'true' && github.event_name == 'workflow_dispatch' && inputs.commit
        env:
          BRANCH: ${{ inputs.branch || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/screenshots
          git commit -m "docs(screenshots): regenerate from ${GITHUB_SHA:0:7}"
          git push origin "HEAD:${BRANCH}"

      - name: Summary
        run: |
          {
            echo "### Documentation screenshots"
            echo
            echo "- images: $(find media/screenshots -name '*.png' | wc -l)"
            echo "- stale: ${{ steps.staleness.outputs.stale }}"
            echo "- event: ${{ github.event_name }}"
            echo
            echo "Each capture asserts the presentation contract (shared theme, unified inbox,"
            echo "populated content) before it is written, and the regenerated set is compared"
            echo "with the committed one at a 0.2 % pixel tolerance."
          } >> "$GITHUB_STEP_SUMMARY"

  result:
    name: docs-screenshots result
    if: always()
    needs: [changes, screenshots]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Propagate failures, cancellations and the reason for omitted work
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYGATE'
          import json, os
          needs = json.loads(os.environ['RESULTS'])
          assert needs['changes']['result'] == 'success', needs
          full = needs['changes']['outputs']['run_tests'] == 'true'
          for name, job in needs.items():
              if name == 'changes': continue
              expected = 'success' if (needs['changes']['outputs'].get('docs_only') == 'true' if name == 'documentation' else full) else 'skipped'
              assert job['result'] == expected, (name, job['result'], expected)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(needs['changes']['outputs']['reason'] + '\n')
          PYGATE
