name: Documentation screenshots

# Keeps media/screenshots/ an accurate picture of the application.
#
# The screenshot spec drives the real application with one shared, populated English demo
# dataset and asserts a presentation contract before every capture: the same theme, the
# unified inbox present, and a populated list, an opened message or declared module
# content. A capture that would be empty, unstyled or inconsistent fails the run.
#
#  - pull_request / push: regenerate and fail if the committed images are stale, so a
#    screenshot can never silently describe an interface that no longer exists;
#  - workflow_dispatch: regenerate and commit the result back to the branch.
#
# Run locally with:
#   cd frontend && DOCS_SCREENSHOTS=1 npx playwright test e2e/docs-screenshots.spec.js \
#     --project=chromium-desktop --project=chromium-mobile-390

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit the regenerated screenshots back to the branch"
        required: false
        type: boolean
        default: true
      branch:
        description: "Branch to update (defaults to the branch this workflow was dispatched from)"
        required: false
        type: string
  pull_request:
    paths:
      - "frontend/e2e/docs-screenshots.spec.js"
      - "frontend/e2e/docs-demo.js"
      - "frontend/e2e/fixtures.js"
      - "frontend/e2e/v3-fixtures.js"
      - "frontend/src/**"
      - "media/screenshots/**"
      - "README.md"
      - "docs/wiki/**"
      - ".github/workflows/docs-screenshots.yml"
      - "scripts/verify-docs-screenshots.mjs"
  push:
    branches: ["dev", "main"]
    paths:
      - "frontend/e2e/docs-screenshots.spec.js"
      - "frontend/e2e/docs-demo.js"
      - "frontend/src/**"
      - "media/screenshots/**"

permissions:
  contents: write

concurrency:
  group: docs-screenshots-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  screenshots:
    name: Regenerate and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: npx playwright install --with-deps chromium

      # The spec runs `vite preview`, which serves frontend/dist. Building first is
      # required, otherwise the captures would show the previous bundle.
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Generate documentation screenshots
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: npm run docs:screenshots

      - name: Verify the screenshot set
        run: node scripts/verify-docs-screenshots.mjs

      - name: Upload the generated screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-screenshots-${{ github.run_id }}
          if-no-files-found: error
          path: media/screenshots/

      - name: Report staleness
        id: staleness
        run: |
          if git diff --quiet -- media/screenshots; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- media/screenshots
          fi

      # Verification runs: the committed images must match what the application renders now.
      - name: Fail when the committed screenshots are stale
        if: steps.staleness.outputs.stale == 'true' && github.event_name != 'workflow_dispatch'
        run: |
          echo "::error::media/screenshots/ is out of date. Download the docs-screenshots artifact and commit the regenerated images, or dispatch this workflow with 'commit' enabled."
          exit 1

      - name: Commit the regenerated screenshots
        if: steps.staleness.outputs.stale == 'true' && github.event_name == 'workflow_dispatch' && inputs.commit
        env:
          BRANCH: ${{ inputs.branch || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/screenshots
          git commit -m "docs(screenshots): regenerate from ${GITHUB_SHA:0:7}"
          git push origin "HEAD:${BRANCH}"

      - name: Summary
        run: |
          {
            echo "### Documentation screenshots"
            echo
            echo "- images: $(find media/screenshots -name '*.png' | wc -l)"
            echo "- stale: ${{ steps.staleness.outputs.stale }}"
            echo "- event: ${{ github.event_name }}"
            echo
            echo "The presentation contract (shared theme, unified inbox, populated content)"
            echo "is asserted by the spec before every capture."
          } >> "$GITHUB_STEP_SUMMARY"
