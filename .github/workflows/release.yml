name: Release

# Publishes the versioned container images for a git tag:
#   ghcr.io/<owner>/inboxora-backend  : v4.0.0, 4.0.0, latest
#   ghcr.io/<owner>/inboxora-frontend : v4.0.0, 4.0.0, latest
# All three tags come from one build of the tagged SHA, so they can never drift.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re-)publish, e.g. v4.0.3"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: GHCR release images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the tagged revision
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve and assert the release tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          tag="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            printf 'Not a release tag: %s\n' "$tag" >&2
            exit 1
          fi

          if ! git rev-parse --verify --quiet "refs/tags/${tag}^{commit}" >/dev/null; then
            printf 'Tag does not exist in this repository: %s\n' "$tag" >&2
            exit 1
          fi

          tag_sha="$(git rev-parse "refs/tags/${tag}^{commit}")"
          head_sha="$(git rev-parse HEAD)"
          if [ "$head_sha" != "$tag_sha" ]; then
            printf 'Checked out %s, but %s points at %s\n' "$head_sha" "$tag" "$tag_sha" >&2
            exit 1
          fi

          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${tag#v}" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$tag_sha" >> "$GITHUB_ENV"
          printf 'Publishing release images for %s from %s\n' "$tag" "$tag_sha"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/inboxora-backend
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=${{ env.RELEASE_VERSION }}
            type=raw,value=latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          provenance: false
          build-args: |
            BUILD_SHA=${{ env.RELEASE_SHA }}
            APP_VERSION=${{ env.RELEASE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/inboxora-frontend
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=${{ env.RELEASE_VERSION }}
            type=raw,value=latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          provenance: false
          build-args: |
            VITE_BUILD_SHA=${{ env.RELEASE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
