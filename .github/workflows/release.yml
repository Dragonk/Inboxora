name: Release

# Publishes the versioned container images for a git tag:
#   ghcr.io/<owner>/inboxora-backend  : v4.0.0, 4.0.0, latest
#   ghcr.io/<owner>/inboxora-frontend : v4.0.0, 4.0.0, latest
# All three tags come from one build of the tagged SHA, so they can never drift.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: GHCR release images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the tagged revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Assert the tag points at an immutable SHA
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "RELEASE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "Building release images for $GITHUB_REF_NAME from $GITHUB_SHA"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/inboxora-backend
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          provenance: false
          build-args: |
            BUILD_SHA=${{ env.RELEASE_SHA }}
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/inboxora-frontend
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          provenance: false
          build-args: |
            VITE_BUILD_SHA=${{ env.RELEASE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
