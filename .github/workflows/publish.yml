name: Publish to GHCR

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Optional immutable commit SHA reachable from the selected repository branch"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: inboxora-dev-image
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      owner: ${{ steps.source.outputs.owner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - name: Validate immutable source and branch ancestry
        id: source
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
          SELECTED_SHA: ${{ github.sha }}
          SELECTED_REF: ${{ github.ref_name }}
          SELECTED_REF_TYPE: ${{ github.ref_type }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          bash scripts/validate-dev-image-source.sh
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "owner=${REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Translation release gate
        uses: ./.github/actions/translation-gate

  build:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
      IMAGE_OWNER: ${{ needs.source.outputs.owner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}
      - run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend labels (no mutable tag is pushed by matrix jobs)
        id: backend-labels
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_OWNER }}/inboxora-backend
          tags: type=raw,value=dev
          labels: org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
      - name: Build backend by immutable digest
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ env.IMAGE_OWNER }}/inboxora-backend,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.backend-labels.outputs.labels }}
          provenance: false
          build-args: |
            BUILD_SHA=${{ env.SOURCE_SHA }}
            APP_VERSION=dev
          cache-from: type=gha,scope=backend-${{ matrix.arch }}
          cache-to: type=gha,scope=backend-${{ matrix.arch }},mode=max
      - name: Frontend labels
        id: frontend-labels
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_OWNER }}/inboxora-frontend
          tags: type=raw,value=dev
          labels: org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
      - name: Build frontend by immutable digest
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ env.IMAGE_OWNER }}/inboxora-frontend,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.frontend-labels.outputs.labels }}
          provenance: false
          build-args: VITE_BUILD_SHA=${{ env.SOURCE_SHA }}
          cache-from: type=gha,scope=frontend-${{ matrix.arch }}
          cache-to: type=gha,scope=frontend-${{ matrix.arch }},mode=max
      - name: Verify the backend maintenance entry points in the built image
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
        run: |
          image="ghcr.io/$IMAGE_OWNER/inboxora-backend@$BACKEND_DIGEST"
          docker run --rm "$image" node dist/scripts/repairConversationHeaders.js --help
          docker run --rm "$image" node dist/scripts/storageMaintenanceStatus.js --help
      - name: Verify native attachment processing in the built image
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
        run: |
          docker run --rm --network none --memory 768m --cpus 2 \
            -e PDF_SIGNATURE_ONLINE=false \
            -v "$PWD/backend/fixtures/attachments:/fixtures:ro" \
            -v "$PWD/scripts/attachment-runtime-smoke.mjs:/runtime-smoke.mjs:ro" \
            "ghcr.io/$IMAGE_OWNER/inboxora-backend@$BACKEND_DIGEST" node /runtime-smoke.mjs
      - name: Record verified platform digests
        env:
          ARCH: ${{ matrix.arch }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          mkdir -p digests
          python3 - <<'PY'
          import json, os, re
          for key in ('BACKEND_DIGEST', 'FRONTEND_DIGEST'):
              assert re.fullmatch(r'sha256:[0-9a-f]{64}', os.environ[key])
          with open('digests/' + os.environ['ARCH'] + '.json', 'w') as output:
              json.dump({key: os.environ[key] for key in ('ARCH','SOURCE_SHA','BACKEND_DIGEST','FRONTEND_DIGEST')}, output)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dev-digests-${{ matrix.arch }}
          path: digests/*.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [source, build]
    runs-on: ubuntu-24.04
    env:
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
      IMAGE_OWNER: ${{ needs.source.outputs.owner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dev-digests-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate both architectures before updating shared dev tags
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          root = pathlib.Path('digests')
          assert sorted(path.name for path in root.glob('*.json')) == ['amd64.json','arm64.json']
          records = [json.loads((root / (arch + '.json')).read_text()) for arch in ('amd64','arm64')]
          for arch, record in zip(('amd64','arm64'), records):
              assert record['ARCH'] == arch and record['SOURCE_SHA'] == os.environ['SOURCE_SHA']
              for key in ('BACKEND_DIGEST','FRONTEND_DIGEST'):
                  assert re.fullmatch(r'sha256:[0-9a-f]{64}', record[key])
          candidates = []
          for component in ('backend','frontend'):
              image = 'ghcr.io/' + os.environ['IMAGE_OWNER'] + '/inboxora-' + component
              candidate = image + ':dev-build-' + os.environ['SOURCE_SHA']
              digests = [image + '@' + record[component.upper() + '_DIGEST'] for record in records]
              subprocess.run(['docker','buildx','imagetools','create','--tag',candidate,*digests], check=True)
              manifest = json.loads(subprocess.check_output(['docker','buildx','imagetools','inspect','--raw',candidate]))
              platforms = {(item['platform']['os'],item['platform']['architecture']) for item in manifest['manifests']}
              assert platforms == {('linux','amd64'),('linux','arm64')}, platforms
              candidates.append((image, candidate))
          # Both complete manifests are verified before either shared tag moves.
          # Registries do not offer a transaction spanning two image repositories.
          for image, candidate in candidates:
              subprocess.run(['docker','buildx','imagetools','create','--tag',image + ':dev',candidate], check=True)
          PY
