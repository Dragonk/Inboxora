name: Publish to GHCR

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Optional immutable commit SHA reachable from origin/dev (defaults to the selected dev revision)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    concurrency:
      group: inboxora-dev-image
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0

      - name: Assert a dev-reachable immutable source revision
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
          SELECTED_SHA: ${{ github.sha }}
        run: |
          source_sha="${REQUESTED_SHA:-$SELECTED_SHA}"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$source_sha"
          git fetch origin dev
          git merge-base --is-ancestor "$source_sha" origin/dev
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Backend ─────────────────────────────────────────────────────────────

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/inboxora-backend
          tags: |
            type=raw,value=dev

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          provenance: false
          build-args: |
            BUILD_SHA=${{ env.SOURCE_SHA }}
            APP_VERSION=dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend ─────────────────────────────────────────────────────────────

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/inboxora-frontend
          tags: |
            type=raw,value=dev

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          provenance: false
          build-args: |
            VITE_BUILD_SHA=${{ env.SOURCE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
