name: Conversation Engine v2 Playwright E2E
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact commit SHA to test (manual runs always run the full suite)"
        required: false
        type: string
        default: ""
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: conversation-v2-playwright-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash -euo pipefail {0}
jobs:
  changes:
    uses: ./.github/workflows/ci-plan.yml
    with:
      expected_sha: ${{ inputs.expected_sha || '' }}
  shards:
    name: Browser shard ${{ matrix.shard }}/4
    needs: changes
    if: needs.changes.outputs.run_browser_e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
      - name: Assert exact tested source
        env:
          SOURCE_SHA: ${{ needs.changes.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium and Linux dependencies
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: npx playwright install --with-deps chromium
      # The preview server consumes dist; unit tests already run in CI / Frontend.
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run every configured project in this shard
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          VITE_E2E_MOCKED: 'true'
        run: |
          npx playwright test --shard=${{ matrix.shard }}/4 --workers=1 --reporter=blob,list \
            --project=chromium-desktop \
            --project=chromium-tablet \
            --project=chromium-mobile-390 \
            --project=chromium-mobile \
            --project=chromium-mobile-landscape
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            frontend/blob-report/
            frontend/artifacts/
          if-no-files-found: warn
          retention-days: 7
  playwright:
    # Keep the established required check, including explicit docs-only success.
    name: Playwright browser E2E (desktop + mobile)
    needs: [changes, shards]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require the planner and all applicable shards
        env:
          PLAN_RESULT: ${{ needs.changes.result }}
          RUN_TESTS: ${{ needs.changes.outputs.run_browser_e2e }}
          SHARDS_RESULT: ${{ needs.shards.result }}
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          test "$PLAN_RESULT" = success
          if [ "$RUN_TESTS" = true ]; then
            test "$SHARDS_RESULT" = success
          else
            test "$RUN_TESTS" = false
            test "$SHARDS_RESULT" = skipped
          fi
          printf '%s\n' "$REASON" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v6
        if: needs.changes.outputs.run_browser_e2e == 'true'
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
      - uses: actions/setup-node@v6
        if: needs.changes.outputs.run_browser_e2e == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Merge all shard reports
        if: needs.changes.outputs.run_browser_e2e == 'true'
        working-directory: frontend
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.run_browser_e2e == 'true'
        with:
          pattern: playwright-shard-*-${{ github.run_id }}
          path: shards
      - name: Assemble one report without changing test results
        if: needs.changes.outputs.run_browser_e2e == 'true'
        run: |
          mkdir all-blob-reports
          find shards -name 'report-*.zip' -exec cp '{}' all-blob-reports/ \;
          test "$(find all-blob-reports -name '*.zip' | wc -l)" -eq 4
          cd frontend
          npx playwright merge-reports --reporter=html ../all-blob-reports
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.run_browser_e2e == 'true'
        with:
          name: conversation-v2-playwright-${{ github.run_id }}
          path: frontend/playwright-report/
          if-no-files-found: error
          retention-days: 7
