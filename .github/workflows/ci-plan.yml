name: CI change plan
on:
  workflow_call:
    inputs:
      expected_sha:
        required: false
        type: string
        default: ''
    outputs:
      run_tests:
        value: ${{ jobs.plan.outputs.run_tests }}
      run_backend:
        value: ${{ jobs.plan.outputs.run_backend }}
      run_backend_database:
        value: ${{ jobs.plan.outputs.run_backend_database }}
      run_frontend:
        value: ${{ jobs.plan.outputs.run_frontend }}
      run_browser_e2e:
        value: ${{ jobs.plan.outputs.run_browser_e2e }}
      run_postgres_e2e:
        value: ${{ jobs.plan.outputs.run_postgres_e2e }}
      run_real_app_e2e:
        value: ${{ jobs.plan.outputs.run_real_app_e2e }}
      run_docs_screenshots:
        value: ${{ jobs.plan.outputs.run_docs_screenshots }}
      run_push_stack:
        value: ${{ jobs.plan.outputs.run_push_stack }}
      docs_only:
        value: ${{ jobs.plan.outputs.docs_only }}
      duplicate_push:
        value: ${{ jobs.plan.outputs.duplicate_push }}
      reason:
        value: ${{ jobs.plan.outputs.reason }}
      source_sha:
        value: ${{ jobs.plan.outputs.source_sha }}
permissions:
  contents: read
  pull-requests: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_tests: ${{ steps.plan.outputs.run_tests }}
      run_backend: ${{ steps.plan.outputs.run_backend }}
      run_backend_database: ${{ steps.plan.outputs.run_backend_database }}
      run_frontend: ${{ steps.plan.outputs.run_frontend }}
      run_browser_e2e: ${{ steps.plan.outputs.run_browser_e2e }}
      run_postgres_e2e: ${{ steps.plan.outputs.run_postgres_e2e }}
      run_real_app_e2e: ${{ steps.plan.outputs.run_real_app_e2e }}
      run_docs_screenshots: ${{ steps.plan.outputs.run_docs_screenshots }}
      run_push_stack: ${{ steps.plan.outputs.run_push_stack }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
      duplicate_push: ${{ steps.plan.outputs.duplicate_push }}
      reason: ${{ steps.plan.outputs.reason }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test the CI planner and gate contracts
        run: node --test scripts/ci-plan.test.mjs scripts/release-source.test.mjs
      - name: Classify changes and avoid duplicate push work
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/ci-plan.mjs
