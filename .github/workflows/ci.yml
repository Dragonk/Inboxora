name: CI

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Every pipeline must propagate its real exit status: `cmd | tail` returns *tail's*
# status, which is how a failing suite once reached `dev` behind a green-looking
# pipe. Single commands are unaffected; the default is here so a future `run:` that
# adds a pipe cannot quietly stop being a gate.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  changes:
    uses: ./.github/workflows/ci-plan.yml
  backend:
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Assert exact tested SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Verify the production header-repair entry point
        working-directory: backend
        run: |
          node dist/scripts/repairConversationHeaders.js --help
          node dist/scripts/storageMaintenanceStatus.js --help

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Test
        working-directory: backend
        run: npm test

      - name: Audit
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

  # The provider layer's real defects — a lost lease, a cursor advanced out of
  # order, a two-worker token refresh, the DAV preconditions — are only reachable
  # against a real PostgreSQL, which is why this job exists rather than trusting the
  # mocked suites. It also proves the whole migration chain applies to an empty
  # database, which no other job does.
  backend-database:
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    name: Backend (PostgreSQL integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mailflow_test
          POSTGRES_PASSWORD: mailflow_test
          POSTGRES_DB: mailflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mailflow_test -d mailflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v6

      - name: Assert exact tested SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Apply the migration chain to an empty database
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_NAME: mailflow_test
          DB_USER: mailflow_test
          DB_PASSWORD: mailflow_test
        # The application's own runner, not a `psql` loop over the files: this is the
        # path production startup takes, it is what the upgrade suite's checksums
        # and `schema_migrations` bookkeeping belong to, and it honours the
        # `-- no-transaction` marker that `CREATE INDEX CONCURRENTLY` needs. The
        # by-file application is exercised separately, by
        # `providerSchemaUpgrade.integration.test.ts`, so both paths are covered
        # rather than only the one this step picks.
        run: node --import tsx src/scripts/runMigrations.ts

      - name: Integration suites
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_NAME: mailflow_test
          DB_USER: mailflow_test
          DB_PASSWORD: mailflow_test
          # This job must execute the Graph continuity suite, never silently skip it.
          REQUIRE_GRAPH_POSTGRES: "1"
          REQUIRE_DAV_POSTGRES: "1"
          REQUIRE_STORAGE_POSTGRES: "1"
          REQUIRE_NATIVE_CUTOVER_POSTGRES: "1"
          REQUIRE_CE_POSTGRES: "1"
          # The send-ledger suite is skipped without this flag, so a job that omits it
          # would report the durable send intent as covered while never running it.
          REQUIRE_SEND_POSTGRES: "1"
          REQUIRE_DEFAULT_RECIPIENTS_POSTGRES: "1"
          REQUIRE_SCHEDULED_MAIL_POSTGRES: "1"
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        # `providerSchemaUpgrade.integration.test.ts` creates and drops a database of
        # its own, so the role needs CREATEDB (the service user has it) and this job
        # must not share its database with another.
        # Explicitly include the route/service PostgreSQL regressions outside the
        # provider directories; the upgrade gate below owns its isolated database.
        run: |
          # Integration fixtures intentionally share one PostgreSQL database. Run them in one
          # worker so fixed fixture identities cannot race across suites under SERIALIZABLE.
          npx vitest run --no-file-parallelism --maxWorkers=1 \
            src/services/storageMaintenance.integration.test.ts \
            src/services/conversationStorage.integration.test.ts \
            src/services/storageRetention.integration.test.ts \
            src/services/mailBodyPrefetch.integration.test.ts \
            src/services/mailBodyCacheRetention.integration.test.ts \
            src/routes/admin.prefetch.integration.test.ts \
            src/routes/mail.cacheAccess.integration.test.ts \
            src/services/imapRuleBody.integration.test.ts \
            src/services/providerAuthService.integration.test.ts \
            src/services/providerTokenService.integration.test.ts \
            src/services/providerOperations.integration.test.ts \
            src/services/providerMutationService.integration.test.ts \
            src/services/providerWritesJournal.integration.test.ts \
            src/services/mailFlagState.integration.test.ts \
            src/services/messageFolderMembership.integration.test.ts \
            src/services/mailFlagMigration.integration.test.ts \
            src/services/imapManager.flags.integration.test.ts \
            src/services/providers/mailFlagAuth.integration.test.ts \
            src/services/calendarCollectionDiscovery.integration.test.ts \
            src/services/calendarCollectionRecovery.integration.test.ts \
            src/routes/accountsCalendarManagement.integration.test.ts \
            src/routes/conversations.visibility.integration.test.ts \
            src/routes/send.limits.integration.test.ts \
            src/routes/mail.mixedBulkTrash.integration.test.ts \
            src/routes/mail.graphLegacyIdentity.integration.test.ts \
            src/routes/calendarPresentation.integration.test.ts \
            src/services/accountNotices.integration.test.ts \
            src/services/defaultSender.integration.test.ts \
            src/services/defaultRecipients.integration.test.ts \
            src/services/scheduledMail.integration.test.ts \
            src/services/carddavSourceOwnership.integration.test.ts \
            src/services/carddavUneditedContact.integration.test.ts \
            src/services/calendarOccurrences.integration.test.ts \
            src/services/genericImapThreading.integration.test.ts \
            src/services/providerMailCutover.integration.test.ts \
            src/services/providerGoogleMailCutover.integration.test.ts \
            src/services/imapTransportGuard.integration.test.ts \
            src/services/providerSyncTargets.integration.test.ts \
            src/services/providerConnectionService.integration.test.ts \
            src/services/providerSchemaUpgrade.integration.test.ts \
            src/services/contactProviderEmailMigration.test.ts \
            src/services/addressBookPresentation.integration.test.ts \
            src/services/settingsUnification.integration.test.ts \
            src/services/accountProviderDiagnostics.integration.test.ts \
            src/services/calendarCollectionMutation.integration.test.ts \
            src/services/calendarCollectionFence.integration.test.ts \
            src/services/providerMutationService.integration.test.ts \
            src/services/calendarCollectionProjection.integration.test.ts \
            src/services/providers/google src/services/providers/microsoft \
            src/services/providers/externalCollectionLinks.integration.test.ts \
            src/services/providerPushSubscriptions.integration.test.ts \
            src/routes/carddavAccount.integration.test.ts \
            src/routes/davPg.integration.test.ts

      - name: Physical thread and DAV collection lifecycle regressions
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_NAME: mailflow_test
          DB_USER: mailflow_test
          DB_PASSWORD: mailflow_test
        run: |
          node --import tsx --test --test-concurrency=1 \
            src/services/mailThreadProjectionReal.integration.ts \
            src/services/davCollectionLifecycle.integration.ts \
            src/routes/davCollectionDeletion.integration.ts

      # The upgrade gate needs a database of its own: it builds the 4.0.4 state (migrations up to 0107, with
      # real legacy Gmail data) and then runs the production runner again for the rest. Running it against the
      # shared database above would fight the already-migrated suites, so it gets a fresh one and runs alone.
      - name: 4.0.4 -> 4.1.0 upgrade gate
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_NAME: inboxora_upgrade_gate
          DB_USER: mailflow_test
          DB_PASSWORD: mailflow_test
          UPGRADE_GATE: "1"
        run: |
          PGPASSWORD=mailflow_test psql -h 127.0.0.1 -U mailflow_test -d postgres \
            -c 'DROP DATABASE IF EXISTS inboxora_upgrade_gate' \
            -c 'CREATE DATABASE inboxora_upgrade_gate'
          npx vitest run src/services/upgradeFrom404.integration.test.ts

      - name: Populated 4.1.1 automatic storage upgrade
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_NAME: inboxora_storage_upgrade
          DB_USER: mailflow_test
          DB_PASSWORD: mailflow_test
          STORAGE_UPGRADE_GATE: "1"
        run: |
          PGPASSWORD=mailflow_test psql -h 127.0.0.1 -U mailflow_test -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE inboxora_storage_upgrade'
          npx vitest run src/services/storageUpgrade.integration.test.ts

  frontend:
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Assert exact tested SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Translation completeness and UI text gate
        working-directory: frontend
        run: npm run test:i18n

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  documentation:
    name: Documentation links and release metadata
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Check documentation links and release versions without launching browsers
        working-directory: frontend
        run: node --import tsx --test src/docsLinks.test.ts packages/scripts/set-app-version.test.cjs

  result:
    name: CI result
    if: always()
    needs: [changes, backend, backend-database, frontend, documentation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Propagate failures, cancellations and the reason for omitted work
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYGATE'
          import json, os
          needs = json.loads(os.environ['RESULTS'])
          assert needs['changes']['result'] == 'success', needs
          full = needs['changes']['outputs']['run_tests'] == 'true'
          for name, job in needs.items():
              if name == 'changes': continue
              expected = 'success' if (needs['changes']['outputs'].get('docs_only') == 'true' if name == 'documentation' else full) else 'skipped'
              assert job['result'] == expected, (name, job['result'], expected)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(needs['changes']['outputs']['reason'] + '\n')
          PYGATE
