services:

  # ── Frontend (nginx — serves React SPA + proxies API) ───────────────────────
  # Default mode: exposes HTTPS on APP_PORT and HTTP on APP_HTTP_PORT.
  # HTTP is intended for use behind a reverse proxy that terminates TLS.
  # Production mode (--profile https): Caddy handles TLS instead (see below)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_BUILD_SHA: ${GIT_SHA:-dev}
        VITE_EMAIL_DIV_RENDER: ${VITE_EMAIL_DIV_RENDER:-false}
    container_name: mailflow-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-443}:443"
      - "${APP_HTTP_PORT:-80}:80"
    volumes:
      - ./certs:/etc/nginx/ssl
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - mailflow

  # ── Backend API ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BUILD_SHA: ${GIT_SHA:-dev}
    container_name: mailflow-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET}
      APP_URL: ${APP_URL:-}
      FRONTEND_URL: ${APP_URL:-}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-mailflow}
      DB_USER: ${DB_USER:-mailflow}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      PUSH_ALLOW_PRIVATE_ENDPOINTS: ${PUSH_ALLOW_PRIVATE_ENDPOINTS:-}
      IMAP_MAX_PERSISTENT_PER_HOST: ${IMAP_MAX_PERSISTENT_PER_HOST:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - mailflow

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mailflow-postgres
    restart: unless-stopped
    # PUID/PGID default to 0:0 (root), identical to the image's normal behaviour.
    # Set them (e.g. 99:100 on Unraid) only when bind-mounting POSTGRES_DATA to a host
    # share, and chown that share to the same uid:gid first.
    user: "${PUID:-0}:${PGID:-0}"
    environment:
      POSTGRES_DB: ${DB_NAME:-mailflow}
      POSTGRES_USER: ${DB_USER:-mailflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${POSTGRES_DATA:-postgres_data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailflow -d mailflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mailflow

  # ── Redis (sessions + caching) ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mailflow-redis
    restart: unless-stopped
    user: "${PUID:-0}:${PGID:-0}"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - ${REDIS_DATA:-redis_data}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - mailflow

  # ── ntfy (built-in UnifiedPush transport) ────────────────────────────────────
  # Android instant notifications travel: Inboxora -> this ntfy -> UnifiedPush
  # distributor (ntfy Android app) -> Inboxora Android. The frontend nginx serves
  # it publicly at ${APP_URL}/push (stripping that prefix) and the container never
  # publishes a host port.
  #
  # Why the prefix is handled in the proxy: ntfy 2.28 refuses a base-url that
  # contains a path ("hosting ntfy on a sub-path is not supported"). The Android
  # ntfy app builds its UnifiedPush endpoint from the URL the user types
  # (https://<host>/push), so the public path survives end to end and only this
  # one proxy hop is rewritten.
  #
  # Anonymous access is limited to UnifiedPush topics ("up" + 12 random base62
  # characters generated on-device, ~71 bits, never derived from a user id or
  # address). Everything else is denied: this is not a public topic server.
  #
  # Advanced: to use your own external ntfy instead, set PUSH_BASE_URL and start
  # with docker-compose.external-ntfy.yml, which disables this service.
  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    container_name: mailflow-ntfy
    restart: unless-stopped
    command: serve
    environment:
      NTFY_LISTEN_HTTP: ":80"
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_CACHE_DURATION: ${NTFY_CACHE_DURATION:-12h}
      NTFY_AUTH_FILE: /var/cache/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_AUTH_ACCESS: "*:up*:rw"
      NTFY_VISITOR_REQUEST_LIMIT_BURST: "60"
      NTFY_VISITOR_REQUEST_LIMIT_REPLENISH: 5s
      NTFY_VISITOR_MESSAGE_DAILY_LIMIT: "500"
    volumes:
      - ${NTFY_DATA:-ntfy_data}:/var/cache/ntfy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mailflow

  # ── Caddy (automatic HTTPS via Let's Encrypt — production only) ──────────────
  # Use docker-compose.https.yml to avoid the port conflict with the frontend:
  #   docker compose -f docker-compose.yml -f docker-compose.https.yml --profile https up -d --build
  # Requires DOMAIN, ACME_EMAIL, and APP_URL to be set in .env, and ports 80/443 to be open.
  caddy:
    profiles: ["https"]
    image: caddy:2-alpine
    container_name: mailflow-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - mailflow

volumes:
  postgres_data:
  redis_data:
  ntfy_data:
  caddy_data:
  caddy_config:

networks:
  mailflow:
    driver: bridge
