# Inboxora — pre-built image install
#
# Quick start:
#   curl -o docker-compose.yml https://raw.githubusercontent.com/Dragonk/Inboxora/main/docker-compose.ghcr.yml
#   curl -o .env               https://raw.githubusercontent.com/Dragonk/Inboxora/main/.env.example
#   # edit .env, then:
#   docker compose up -d
#
# To pin a specific version instead of latest, set INBOXORA_VERSION in your .env:
#   INBOXORA_VERSION=3.4.0

services:

  # ── Frontend (nginx — serves React SPA + proxies API) ───────────────────────
  # Exposes HTTPS on APP_PORT and HTTP on APP_HTTP_PORT.
  # HTTP is intended for use behind a reverse proxy that terminates TLS.
  frontend:
    image: ghcr.io/dragonk/inboxora-frontend:${INBOXORA_VERSION:-latest}
    container_name: inboxora-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-443}:443"
      - "${APP_HTTP_PORT:-80}:80"
    volumes:
      - ./certs:/etc/nginx/ssl
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - inboxora

  # ── Backend API ──────────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/dragonk/inboxora-backend:${INBOXORA_VERSION:-latest}
    container_name: inboxora-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      NODE_ENV: production
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET}
      APP_URL: ${APP_URL:-}
      FRONTEND_URL: ${APP_URL:-}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-inboxora}
      DB_USER: ${DB_USER:-inboxora}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      IMAP_MAX_PERSISTENT_PER_HOST: ${IMAP_MAX_PERSISTENT_PER_HOST:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - inboxora

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: inboxora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-inboxora}
      POSTGRES_USER: ${DB_USER:-inboxora}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inboxora -d inboxora"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - inboxora

  # ── Redis (sessions + caching) ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: inboxora-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - inboxora

  # ── Caddy (automatic HTTPS via Let's Encrypt — optional) ────────────────────
  # Use docker-compose.https.yml to avoid the port conflict with the frontend:
  #   docker compose -f docker-compose.yml -f docker-compose.https.yml --profile https up -d
  # Requires DOMAIN, ACME_EMAIL, and APP_URL to be set in .env, and ports 80/443 open.
  caddy:
    profiles: ["https"]
    image: caddy:2-alpine
    container_name: inboxora-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    depends_on:
      - frontend
    networks:
      - inboxora

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  inboxora:
    driver: bridge

configs:
  caddyfile:
    content: |
      {
          email ${ACME_EMAIL:-}
      }

      ${DOMAIN:-localhost} {
          reverse_proxy frontend:443 {
              transport http {
                  tls_insecure_skip_verify
              }
          }
      }
